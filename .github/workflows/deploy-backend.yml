name: Deploy Backend to Oracle VM

on:
  push:
    branches: [ main, package-updates ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

jobs:
#   test:
#     runs-on: ubuntu-latest
#     steps:
#     - uses: actions/checkout@v4
#     - uses: actions/setup-node@v4
#       with:
#         node-version: '20'
#     - name: Install dependencies
#       run: npm --prefix backend install
#     - name: Run tests
#       run: npm --prefix backend test || echo "No tests configured"

  deploy:
#   needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oracle_vm
        chmod 600 ~/.ssh/oracle_vm
        ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to Oracle VM
      run: |
        ssh -i ~/.ssh/oracle_vm -o StrictHostKeyChecking=no ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} '
          cd /home/ubuntu/playlist-backend/backend &&
          git fetch origin &&
          git checkout ${{ github.ref_name }} &&
          git pull origin ${{ github.ref_name }} &&
          cat > .env << EOF
MONGODB_URI=${{ secrets.MONGODB_URI }}
FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
FRONTEND_URL=${{ secrets.FRONTEND_URL }}
NODE_ENV=${{ github.ref_name == 'main' && 'production' || 'development' }}
PORT=3000
EOF
          npm install &&
          pm2 restart backend &&
          pm2 logs backend --lines 10
        '
    
    - name: Health Check
      run: |
        sleep 10
        curl -f https://dragora-api.duckdns.org/health || exit 1

    - name: Deployment Success
      run: |
        echo "✅ Backend deployed successfully to OCI"
        echo "🔗 API: https://dragora-api.duckdns.org/api"
        echo "💚 Health: https://dragora-api.duckdns.org/health"